# Nginx configuration for FloodGuard production deployment
# This config should be used with gunicorn/uvicorn running on port 8000

upstream django {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    if ($host = floodguard.co.ke) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name floodguard.co.ke www.floodguard.co.ke;
    
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Allow health checks on HTTP without redirect
    location = /health/ {
        proxy_pass http://django;
        access_log off;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }


}

server {
    listen 443 ssl http2;
    server_name floodguard.co.ke www.floodguard.co.ke;
    
    # SSL certificates (use Let's Encrypt or your provider)
    ssl_certificate /etc/letsencrypt/live/floodguard.co.ke-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/floodguard.co.ke-0001/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Client body size limit (for photo uploads)
    client_max_body_size 10M;
    
    # Static files
    location /static/ {
        # docker-compose bind-mounts the project at /code; on the VPS nginx
        # runs on the host, where that directory is /app/floodguard.
        alias /app/floodguard/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
    }
    
    # Media files (uploaded photos)
    location /media/ {
        alias /app/floodguard/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    
    # WebSocket support
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }
    
    # Main application
    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Health check endpoint
    location /health/ {
        proxy_pass http://django;
        access_log off;
    }
    
    # Do not internally redirect 404s to a non-existent static `404.html`.
    # Django renders its own 404 template for application routes.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

}
