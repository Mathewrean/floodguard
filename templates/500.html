{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="section" role="alert" aria-label="Server error">
    <div class="container">
        <div class="empty-state">
            <div class="empty-state-icon" aria-hidden="true">⚠️</div>
            <h1 class="empty-state-title">500</h1>
            <h2 class="empty-state-title">Server Error</h2>
            <p class="empty-state-desc">Something went wrong on our end. Please try again later.</p>
            <div class="empty-state-actions">
                <a href="{% url 'landing_index' %}" class="btn btn-primary">Go Home</a>
                <button type="button" class="btn btn-secondary" onclick="location.reload()">Try Again</button>
            </div>
        </div>
    </div>
</section>
{% endblock %}
