{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <div style="text-align: center; margin-bottom: 24px;">
            <svg width="40" height="40" viewBox="0 0 32 32" fill="none" style="color:var(--primary-light)">
                <path d="M5 19c5-9 7-12 11-17 4 5 6 8 11 17 3 7-2 12-11 12S2 26 5 19z" fill="currentColor" opacity=".28"/>
                <path d="M7 22c3 2 6 2 9 0s6-2 9 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
            <h2 style="margin-top: 16px;">Create Your FloodGuard Account</h2>
        </div>
        <div id="register-error" class="alert alert-error" aria-live="polite" style="display: {% if error %}block{% else %}none{% endif %};"></div>
        {% if error %}
            <script>document.getElementById('register-error').textContent = '{{ error }}';</script>
        {% endif %}
        <form method="post" class="auth-form" id="register-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required maxlength="150">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password1">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password1" name="password1" autocomplete="new-password" required minlength="8" style="width: 100%; padding-right: 40px;">
                    <button type="button" class="toggle-password" data-target="password1" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px;" aria-label="Toggle password visibility">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="password2">Confirm Password</label>
                <div style="position: relative;">
                    <input type="password" id="password2" name="password2" autocomplete="new-password" required minlength="8" style="width: 100%; padding-right: 40px;">
                    <button type="button" class="toggle-password" data-target="password2" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px;" aria-label="Toggle password visibility">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <small id="password-match" style="display: none;"></small>
            </div>
            <div class="form-group">
                <label for="phone_number">Phone Number (optional, for SMS alerts)</label>
                <input type="tel" id="phone_number" name="phone_number"
                       placeholder="+254712345678"
                       pattern="^\+[1-9]\d{1,14}$"
                       title="International format: +[country code][number] (e.g., +254712345678)">
                <small>Include country code. Required for emergency SMS alerts.</small>
            </div>
            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 8px; font-weight: 400;">
                    <input type="checkbox" id="terms" name="terms" required>
                    I agree to the <a href="/terms/" target="_blank">Terms and Conditions</a> and <a href="/privacy/" target="_blank">Privacy Policy</a>
                </label>
            </div>
            <button type="submit" class="btn-primary btn-block" id="register-submit">Create Account</button>
        </form>
        <p class="auth-footer">
            Already have an account? <a href="{% url 'login' %}">Sign in</a>
        </p>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const toggleButtons = document.querySelectorAll('.toggle-password');
        toggleButtons.forEach(function(btn) {
            btn.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const input = document.getElementById(targetId);
                if (input) {
                    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                    input.setAttribute('type', type);
                }
            });
        });

        const password1 = document.getElementById('password1');
        const password2 = document.getElementById('password2');
        const matchIndicator = document.getElementById('password-match');

        function checkPasswordMatch() {
            if (!password1 || !password2 || !matchIndicator) return;
            if (password1.value && password2.value) {
                if (password1.value === password2.value) {
                    matchIndicator.textContent = 'Passwords match';
                    matchIndicator.style.color = 'green';
                    matchIndicator.style.display = 'block';
                } else {
                    matchIndicator.textContent = 'Passwords do not match';
                    matchIndicator.style.color = 'red';
                    matchIndicator.style.display = 'block';
                }
            } else {
                matchIndicator.style.display = 'none';
            }
        }

        if (password1 && password2) {
            password1.addEventListener('input', checkPasswordMatch);
            password2.addEventListener('input', checkPasswordMatch);
        }

        const registerForm = document.getElementById('register-form');
        const registerSubmit = document.getElementById('register-submit');

        if (registerForm) {
            registerForm.addEventListener('submit', function(e) {
                const username = document.getElementById('username').value.trim();
                const email = document.getElementById('email').value.trim();
                const pw1 = password1 ? password1.value.trim() : '';
                const pw2 = password2 ? password2.value.trim() : '';
                const terms = document.getElementById('terms');
                const errorEmpty = document.getElementById('register-error');

                if (!username || !email || !pw1 || !pw2) {
                    e.preventDefault();
                    if (errorEmpty) {
                        errorEmpty.textContent = 'Please fill in all required fields.';
                        errorEmpty.style.display = 'block';
                    }
                    return;
                }

                if (pw1 !== pw2) {
                    e.preventDefault();
                    if (errorEmpty) {
                        errorEmpty.textContent = 'Passwords do not match.';
                        errorEmpty.style.display = 'block';
                    }
                    return;
                }

                if (!terms || !terms.checked) {
                    e.preventDefault();
                    if (errorEmpty) {
                        errorEmpty.textContent = 'You must agree to the Terms and Conditions.';
                        errorEmpty.style.display = 'block';
                    }
                    return;
                }

                registerSubmit.disabled = true;
                registerSubmit.textContent = 'Creating Account...';
            });
        }
    });
</script>
{% endblock %}
