{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <div style="text-align: center; margin-bottom: 24px;">
            <svg width="40" height="40" viewBox="0 0 32 32" fill="none" style="color:var(--primary-light)">
                <path d="M5 19c5-9 7-12 11-17 4 5 6 8 11 17 3 7-2 12-11 12S2 26 5 19z" fill="currentColor" opacity=".28"/>
                <path d="M7 22c3 2 6 2 9 0s6-2 9 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
            <h2 style="margin-top: 16px;">Login to FloodGuard</h2>
        </div>
            <div id="login-error" class="alert alert-error" aria-live="polite" style="display: {% if error %}block{% else %}none{% endif %};"></div>
        {% if error %}
            <script>document.getElementById('login-error').textContent = '{{ error }}';</script>
        {% endif %}
        <form method="post" class="auth-form" id="login-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" name="password" autocomplete="current-password" required style="width: 100%; padding-right: 40px;">
                    <button type="button" id="toggle-password-login" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px;" aria-label="Toggle password visibility">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
            <div id="login-error-empty" class="alert alert-error" aria-live="polite" style="display: none;"></div>
            <button type="submit" class="btn-primary btn-block" id="login-submit">Login</button>
        </form>
        <p class="auth-footer">
            Don't have an account? <a href="{% url 'register' %}">Register here</a>
        </p>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const loginForm = document.getElementById('login-form');
        const loginSubmit = document.getElementById('login-submit');
        const togglePassword = document.getElementById('toggle-password-login');
        const passwordInput = document.getElementById('password');

        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
            });
        }

        if (loginForm) {
            loginForm.addEventListener('submit', function(e) {
                const username = document.getElementById('username').value.trim();
                const password = passwordInput.value.trim();
                const errorEmpty = document.getElementById('login-error-empty');

                if (!username || !password) {
                    e.preventDefault();
                    if (errorEmpty) {
                        errorEmpty.textContent = 'Please enter both username and password.';
                        errorEmpty.style.display = 'block';
                    }
                    return;
                }

                loginSubmit.disabled = true;
                loginSubmit.textContent = 'Signing in...';
            });
        }
    });
</script>
{% endblock %}
