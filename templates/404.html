{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="section" role="alert" aria-label="Page not found">
    <div class="container">
        <div class="empty-state">
            <div class="empty-state-icon" aria-hidden="true">🔍</div>
            <h1 class="empty-state-title">404</h1>
            <h2 class="empty-state-title">Page Not Found</h2>
            <p class="empty-state-desc">The page you're looking for doesn't exist or has been moved.</p>
            <div class="empty-state-actions">
                <a href="{% url 'landing_index' %}" class="btn btn-primary">Go Home</a>
                <a href="{% url 'gis_dashboard' %}" class="btn btn-secondary">View Live Map</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
