name: Deploy FloodGuard to Contabo VPS

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Layers
        uses: actions/checkout@v4

      - name: SSH into Contabo Server and Execute Pull & Build Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}  # Recommended: Store IP in Secrets
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd /app/floodguard
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py collectstatic --noinput
            docker compose exec -T web python manage.py check --deploy
            docker compose ps
            curl --fail --retry 10 --retry-connrefused -H 'Host: localhost' http://127.0.0.1:8000/health/
