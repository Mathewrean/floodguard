services:
  db:
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-floodguard}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 floodguard.asgi:application
    volumes:
      # Includes `/code/staticfiles`; collectstatic writes directly into the
      # VPS checkout that host nginx serves at /app/floodguard/staticfiles.
      - .:/code
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /code
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=floodguard.settings
      - SECURE_SSL_REDIRECT=True
      - SECURE_PROXY_SSL_HEADER=HTTP_X_FORWARDED_PROTO,https
      - DB_HOST=db
      - DB_PORT=5432
      # Prevent a host-oriented DATABASE_URL in .env from overriding the
      # Compose service hostname configured above.
      - DATABASE_URL=
      - REDIS_URL=redis://redis:6379/0

  celery:
    build: .
    command: celery -A floodguard worker -l info
    volumes:
      - .:/code
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /code
    environment:
      - DEBUG=${DEBUG:-True}
      - DJANGO_SETTINGS_MODULE=floodguard.settings
      - DB_HOST=db
      - DB_PORT=5432
      - DATABASE_URL=
      - REDIS_URL=redis://redis:6379/0

  celery-beat:
    build: .
    command: celery -A floodguard beat -l info
    volumes:
      - .:/code
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /code
    environment:
      - DEBUG=${DEBUG:-True}
      - DJANGO_SETTINGS_MODULE=floodguard.settings
      - DB_HOST=db
      - DB_PORT=5432
      - DATABASE_URL=
      - REDIS_URL=redis://redis:6379/0

volumes:
  postgres_data:
  redis_data:
